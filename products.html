<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="products.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Arima:wght@100..700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="shortcut icon" href="./Assets/Image/daisyIcon.png" type="image/x-icon">
    <title>Marguerite Sacs</title>
</head>

<body class="page-transition">
    <section id="products">

        <header>
            <div><a href="./index.html"><img class="logoStore" src="./Assets/Image/logoStore.png"
                        alt="Logo Store" /></a></div>
            <div>
                <nav>
                    <ul>
                        <li><a href="./index.html">Home</a></li>
                        <li><a href="./products.html">Produtos</a></li>
                        <li><a href="./about.html">Sobre</a></li>
                        <li><a href="./contacts.html">Contatos</a></li>
                        <li><a href="#"><i class="bi bi-person-circle"></i></a></li>
                        <li>
                            <a href="#" class="cart-link">
                                <i class="bi bi-bag"></i>
                                <span class="cart-badge" id="cart-badge">0</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </header>
        <main>
            <h2 class="title-products">Nossos Produtos</h2>
            <div class="filter-products">
                <button class="filter-btn" onclick="filterByCategory('all')">Todos</button>
                <button class="filter-btn" onclick="filterByCategory('bag')">Bolsas</button>
                <button class="filter-btn" onclick="filterByCategory('necessaire')"><span translate="no" lang="fr">Necessaire</span></button>
                <button class="filter-btn" onclick="filterByCategory('wallet')">Carteiras</button>
            </div>
            <div id="cards-products"></div>
            <button class="btn-bag"><img src="./Assets/Image/daisyIcon.png" alt="Daisy Icon"> Conferir a sacola</button>
        </main>
        <footer>
            <p><i class="bi bi-c-circle"></i>2026 Projeto de Estudo - Desenvolvido por <a
                    href="https://linkedin.com/in/helenamignogna/" target="_blank">Helena Mignogna</a></p>
            <p>"Este é um projeto fictício e acadêmico sem fins comerciais. Nenhuma transação real será realizada."
            </p>
        </footer>
    </section>
    <!-- Cart modal -->
    <div id="cart-modal" class="cart-modal">
        <div class="cart-modal-content">
            <button class="close-cart" id="close-cart">×</button>
            <h3><img src="./Assets/Image/daisyIcon.png" alt="Daisy Icon"> Sua Sacola (Simulação)</h3>
            <div id="cart-modal-body"></div>
        </div>
    </div>
    <!-- Checkout / address modal -->
    <div id="checkout-modal" class="cart-modal">
        <div class="cart-modal-content">
            <button class="close-cart" id="close-checkout">×</button>
            <div id="checkout-modal-body"></div>
        </div>
    </div>
    <script type="module" src="script.js"></script>

</body>

</html>
